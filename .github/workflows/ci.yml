name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore KobiPanel.sln

      - name: Build
        run: dotnet build KobiPanel.sln --no-restore --configuration Release

      # Entegrasyon testleri EF InMemory kullanır, SQL Server gerekmez
      - name: Test
        run: dotnet test KobiPanel.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kobipanel-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kobipanel-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # CRA, CI=true iken ESLint uyarılarını hata sayar. Mevcut uyarılar
      # (react-hooks/exhaustive-deps vb.) temizlenene kadar build'i kırmasın.
      - name: Build
        run: npm run build
        env:
          CI: false
